name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Create isolated write-test database
        run: >
          node -e "const{Client}=require('pg');
          (async()=>{const c=new Client({connectionString:process.env.DATABASE_URL});
          await c.connect();
          try{await c.query('CREATE DATABASE ci_write')}
          catch(e){if(!String(e.message).includes('already exists'))throw e}
          await c.end()})()"
      - name: Replay migrations on app and write-test databases
        run: |
          npx prisma migrate deploy
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run verify:auth
      - run: npm run verify:clinical
      - run: npm run verify:test-day
      - run: npm run verify:test-day-collab
      - run: npm run verify:custom-tests
      - run: npm run verify:auth-actions
      - run: npm run verify:test-day-collab-actions
      - run: npm run build
